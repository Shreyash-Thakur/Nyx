version: "3.9"

# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required: copy .env.example to .env and fill in every value before deploying.
# Generate secrets with: openssl rand -hex 32

services:
  api:
    build:
      target: production
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_FORMAT: json
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://ledgerflow:${POSTGRES_PASSWORD}@db:5432/ledgerflow
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers

  worker:
    restart: always
    environment:
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: postgresql://ledgerflow:${POSTGRES_PASSWORD}@db:5432/ledgerflow

  db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    ports: []

  rq-dashboard:
    ports: []  # not exposed in production — access via docker exec or SSH tunnel

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
